<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Medical cross (NHS red → blue for AI theme) -->
  <rect x="26" y="12" width="12" height="40" rx="3" fill="url(#grad)"/>
  <rect x="12" y="26" width="40" height="12" rx="3" fill="url(#grad)"/>
  <!-- Small pulse/trend line overlay -->
  <polyline points="14,38 22,38 26,30 32,44 38,24 42,38 50,38"
    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
</svg>
